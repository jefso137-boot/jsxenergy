{% extends "base.html" %}
{% load static %}
{% block title %}Login — JSX Energy{% endblock %}
{% block content %}
<div class="mt-16 bg-white rounded-2xl shadow p-8">
    <div class="text-center mb-8">
        <img src="{% static 'images/jsx_energy_logo.jpeg' %}" alt="JSX Energy" class="w-24 h-24 rounded-2xl mx-auto">
        <p class="text-sm text-gray-500 mt-3">Sistema de Ordens de Serviço</p>
    </div>

    {% if form.errors %}
    <div class="mb-4 rounded-lg bg-red-100 text-red-800 px-4 py-3 text-sm">
        Usuário ou senha inválidos.
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium mb-1">Usuário</label>
            <input type="text" name="username" autofocus required
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Senha</label>
            <input type="password" name="password" required
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange">
        </div>
        <button type="submit"
                class="w-full bg-orange text-white font-bold rounded-lg py-3 mt-2">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
